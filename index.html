<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Disciplina</title>
  <meta name="theme-color" content="#0c0b09">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">DISCIPLINA</div>
    <nav class="datebar" aria-label="Navegación de días">
      <button id="prev" class="nav" type="button" aria-label="Día anterior"></button>
      <div class="datewrap">
        <span id="dateLabel" class="date"></span>
        <input id="datePicker" class="datepicker" type="date" aria-label="Elegir fecha">
      </div>
      <button id="next" class="nav" type="button" aria-label="Día siguiente"></button>
      <button id="today" class="todaybtn" type="button">HOY</button>
    </nav>
    <div id="summary" class="summary" role="status"></div>
  </header>

  <section id="prios" class="prios" aria-label="Lo que hoy no se negocia"></section>

  <main id="agenda" class="agenda" aria-label="Agenda del día"></main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
