<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Mapa de Clientes Luján</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --azul:#1f6feb; --rojo:#d1242f; --texto:#1b1f24; --borde:#d0d7de; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:18px; color:var(--texto); }
  #map { position:fixed; inset:0; background:#e8e4da; }

  /* Barra de abajo */
  #barra { position:fixed; left:0; right:0; bottom:0; z-index:1100; background:#fff;
    border-top:1px solid var(--borde); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
  .fila { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .fila::-webkit-scrollbar { display:none; }
  .fila + .fila { margin-top:8px; }
  button { font:inherit; font-weight:600; min-height:52px; padding:0 16px; border-radius:12px;
    border:2px solid var(--borde); background:#f6f8fa; color:var(--texto); white-space:nowrap; flex:0 0 auto; touch-action:manipulation; }
  button:active { filter:brightness(.92); }
  .barrio.activo { background:var(--azul); border-color:var(--azul); color:#fff; }
  .accion { flex:1 1 0; min-width:0; padding:0 6px; font-size:16px; }
  #btnUbic { flex:0 0 60px; font-size:24px; }
  .primario { background:var(--azul); border-color:var(--azul); color:#fff; }
  .peligro { color:var(--rojo); border-color:var(--rojo); background:#fff; }

  /* Ventanas (formulario / ficha) */
  .velo { position:fixed; inset:0; z-index:1200; background:rgba(0,0,0,.45); display:none; align-items:flex-end; }
  .velo.abierto { display:flex; }
  .hoja { background:#fff; width:100%; max-height:92%; overflow-y:auto; border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .hoja h2 { margin:0 0 12px; font-size:24px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input, textarea { width:100%; font:inherit; padding:12px; border:2px solid var(--borde); border-radius:10px; background:#fff; color:var(--texto); }
  input:focus, textarea:focus { outline:none; border-color:var(--azul); }
  textarea { min-height:90px; resize:vertical; }
  .botones { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .botones button { flex:1 1 40%; }
  .dato { margin:8px 0; word-break:break-word; }
  .dato small { display:block; color:#57606a; font-size:15px; }
  .dato a { color:var(--azul); font-weight:600; }

  /* Pines */
  .pin { background:none; border:none; }
  .pin svg { display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
  .etiqueta { background:#fff; border:1px solid #888; border-radius:6px; font-weight:700; font-size:14px; padding:2px 6px; box-shadow:none; }
  .etiqueta::before { display:none; }
  .lejos .etiqueta { display:none; }
  .etq-barrio { background:rgba(255,255,255,.78); border:none; box-shadow:none; color:#1b1f24; font-weight:700; font-size:12px; padding:1px 4px; }
  .etq-barrio::before { display:none; }
  .muylejos .etq-barrio, .muycerca .etq-barrio { display:none; }
  .leaflet-control-attribution { font-size:11px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { flex:1 1 auto; min-width:58px; padding:0 10px; }
  .chips button.sel { background:var(--azul); border-color:var(--azul); color:#fff; }
  .punto { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  #btnInfo { max-width:55vw; overflow:hidden; text-overflow:ellipsis; }
  .num { background:none; border:none; }
  .num div { width:28px; height:28px; border-radius:50%; background:#1f6feb; color:#fff; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.55); }
  .num div.h { background:#8c959f; }
  .num div.p { background:#fb8500; width:36px; height:36px; margin:-4px 0 0 -4px; font-size:16px; }
  .pre { white-space:pre-line; }
  .estados button.sel { color:#fff; border-color:transparent; }
  .parada { display:flex; gap:8px; margin-top:8px; }
  .parada .ver { flex:1 1 auto; min-width:0; text-align:left; white-space:normal; }
  .parada .ok { flex:0 0 56px; padding:0; }
  .parada.hecha .ver { text-decoration:line-through; color:#57606a; }
  .parada small { display:block; font-weight:400; color:#57606a; }
  #lItems button { display:flex; justify-content:space-between; width:100%; margin-top:8px; text-align:left; }
  #lItems small { font-weight:400; color:#57606a; align-self:center; }
  input[type=search] { -webkit-appearance:none; appearance:none; }

  #aviso { position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); z-index:1300;
    background:#1b1f24; color:#fff; padding:14px 16px; border-radius:12px; text-align:center; display:none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="barra">
  <div class="fila" id="barrios"></div>
  <div class="fila">
    <button class="accion" id="btnUbic" aria-label="Mi ubicación">📍</button>
    <button class="accion" id="btnBarrio">+ barrio</button>
    <button class="accion" id="btnExp">Exportar</button>
    <button class="accion" id="btnImp">Importar</button>
  </div>
</div>

<input type="file" id="archivo" accept="application/json,.json" hidden>

<!-- Formulario de cliente -->
<div class="velo" id="vFormulario">
  <form class="hoja" id="formCliente" autocomplete="off">
    <h2 id="tituloForm">Nuevo cliente</h2>
    <label for="fNombre">Nombre</label>
    <input id="fNombre" maxlength="80" placeholder="Si no sabés el nombre, dejalo vacío">
    <label for="fDir">Dirección</label>
    <input id="fDir" maxlength="120">
    <label for="fTel">Teléfono</label>
    <input id="fTel" type="tel" inputmode="tel" maxlength="40">
    <label for="fNota">Nota</label>
    <textarea id="fNota" maxlength="500"></textarea>
    <div class="botones">
      <button type="button" id="fCancelar">Cancelar</button>
      <button type="submit" class="primario">Guardar</button>
    </div>
  </form>
</div>

<!-- Formulario de barrio -->
<div class="velo" id="vBarrio">
  <form class="hoja" id="formBarrio" autocomplete="off">
    <h2>Nuevo barrio</h2>
    <p style="margin:0">Se guarda con lo que estás viendo ahora en el mapa (centro y zoom).</p>
    <label for="bNombre">Nombre del barrio</label>
    <input id="bNombre" required maxlength="40">
    <div class="botones">
      <button type="button" id="bCancelar">Cancelar</button>
      <button type="submit" class="primario">Guardar</button>
    </div>
  </form>
</div>

<!-- Lista de barrios -->
<div class="velo" id="vLista">
  <div class="hoja">
    <h2>Barrios</h2>
    <div class="dato" id="lResumen"></div>
    <div class="chips" id="lFiltros"></div>
    <button id="lRepartir" style="width:100%;margin-top:10px">📅 Repartir Luján en días (automático)</button>
    <input id="lBuscar" type="search" placeholder="Buscar barrio…" autocomplete="off" style="margin-top:10px">
    <div id="lItems"></div>
    <div class="botones">
      <button id="lCerrar" style="flex-basis:100%">Cerrar</button>
    </div>
  </div>
</div>

<!-- Reparto automático en días -->
<div class="velo" id="vReparto">
  <div class="hoja">
    <h2>Repartir Luján en días</h2>
    <p style="margin:0">Agrupa los barrios por cercanía y trata de que cada día tenga un trabajo parecido. Después podés cambiar cualquier barrio a mano.</p>
    <label>Días que salís</label>
    <div class="chips" id="pDias"></div>
    <label>Opciones</label>
    <div class="chips" id="pOpc"></div>
    <div class="dato pre" id="pResultado"></div>
    <div class="botones">
      <button id="pCerrar">Cerrar</button>
      <button class="peligro" id="pDeshacer" style="display:none">Deshacer</button>
      <button class="primario" id="pHacer" style="flex-basis:100%">Repartir</button>
    </div>
  </div>
</div>

<!-- Día y estado de un barrio -->
<div class="velo" id="vZona">
  <div class="hoja">
    <h2 id="zNombre"></h2>
    <div class="dato" id="zInfo"></div>
    <label>Día de visita</label>
    <div class="chips" id="zDias"></div>
    <label>Estado</label>
    <div class="chips" id="zEstados"></div>
    <div class="botones">
      <button class="primario" id="zCerrar" style="flex-basis:100%">Listo</button>
    </div>
  </div>
</div>

<!-- Ruta -->
<div class="velo" id="vRuta">
  <div class="hoja">
    <h2>Ruta del recorrido</h2>
    <div class="dato" id="rResumen"></div>
    <div class="chips" id="rModo"></div>
    <div class="botones">
      <button class="primario" id="rProxima" style="flex-basis:100%">▶ Ir a la próxima parada</button>
    </div>
    <label>Toda la ruta en Google Maps</label>
    <div class="chips" id="rTramos"></div>
    <label>Paradas (tocá ✓ al visitar)</label>
    <div id="rLista"></div>
    <div class="botones">
      <button id="rRehacer">Armar de nuevo</button>
      <button class="peligro" id="rBorrar">Borrar ruta</button>
      <button id="rCerrar" style="flex-basis:100%">Cerrar</button>
    </div>
  </div>
</div>

<!-- Ficha de cliente -->
<div class="velo" id="vFicha">
  <div class="hoja">
    <h2 id="kNombre"></h2>
    <div class="dato" id="kDir"></div>
    <div class="dato" id="kTel"></div>
    <div class="dato" id="kNota"></div>
    <div class="chips estados" id="kEstados"></div>
    <div class="botones">
      <button class="primario" id="kMaps" style="flex-basis:100%">🗺 Ir en Maps</button>
      <button id="kHecho" style="flex-basis:100%;display:none"></button>
      <button id="kEditar">✏ Editar</button>
      <button class="peligro" id="kBorrar">🗑 Borrar</button>
      <button id="kCerrar" style="flex-basis:100%">Cerrar</button>
    </div>
  </div>
</div>

<div id="aviso" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  'use strict';

  /* ---------- Datos (localStorage) ---------- */
  var LS_CLIENTES = 'mcl_clientes';
  var LS_BARRIOS = 'mcl_barrios';
  // Las coordenadas de Ameghino son aproximadas: parate en el barrio y tocá "+ barrio" con el mismo nombre para corregirlas.
  var BARRIOS_INICIALES = [
    { id: 'centro', nombre: 'Luján centro', lat: -34.5703, lng: -59.1050, zoom: 15 },
    { id: 'ameghino', nombre: 'Barrio Ameghino', lat: -34.5600, lng: -59.1250, zoom: 15 }
  ];

  function leer(clave, porDefecto) {
    try {
      var v = JSON.parse(localStorage.getItem(clave));
      return Array.isArray(v) ? v : porDefecto;
    } catch (e) { return porDefecto; }
  }
  function guardar(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); }
    catch (e) { aviso('No pude guardar en el celu. Revisá que haya espacio y que no estés en pestaña privada.'); }
  }
  function nuevoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  var LS_ZONAS = 'mcl_zonas_info';
  function leerObj(clave) {
    try {
      var v = JSON.parse(localStorage.getItem(clave));
      return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    } catch (e) { return {}; }
  }
  var zonasInfo = leerObj(LS_ZONAS);   // { "Nombre del barrio": { dia: 0-6|null, estado, fecha } }
  var LS_RUTA = 'mcl_ruta';
  var ruta = (function () {          // { ids, hechos, modo, origen:{lat,lng}, creada }
    try { var v = JSON.parse(localStorage.getItem(LS_RUTA)); return v && Array.isArray(v.ids) ? v : null; }
    catch (e) { return null; }
  })();
  var ESTADOS_C = [
    { k: 'nuevo', t: 'Sin contactar', color: '#d1242f' },
    { k: 'interesado', t: 'Interesado', color: '#2da44e' },
    { k: 'volver', t: 'Volver', color: '#fb8500' },
    { k: 'no', t: 'No le interesa', color: '#6e7781' },
    { k: 'cliente', t: 'Ya es cliente', color: '#8250df' }
  ];
  function estadoC(c) {
    return ESTADOS_C.filter(function (e) { return e.k === c.estado; })[0] || ESTADOS_C[0];
  }
  var clientes = leer(LS_CLIENTES, []);
  var barrios = leer(LS_BARRIOS, null);
  if (!barrios || !barrios.length) { barrios = BARRIOS_INICIALES.slice(); guardar(LS_BARRIOS, barrios); }

  /* ---------- Utilidades ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var avisoTimer;
  function aviso(txt) {
    var a = $('aviso');
    a.textContent = txt; a.style.display = 'block';
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { a.style.display = 'none'; }, 3500);
  }
  function abrir(id) { $(id).classList.add('abierto'); }
  function cerrar(id) { $(id).classList.remove('abierto'); }
  function hayVentana() { return document.querySelector('.velo.abierto') !== null; }
  function fechaLocal() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  /* ---------- Mapa ---------- */
  var map = L.map('map', { zoomControl: false, attributionControl: false, tap: true })
    .setView([-34.5703, -59.1050], 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, crossOrigin: true }).addTo(map);
  L.control.attribution({ position: 'topright', prefix: false })
    .addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · v7').addTo(map);

  var capa = L.layerGroup().addTo(map);
  var miPunto = null;

  function iconoPin(color) {
    return L.divIcon({
      className: 'pin', iconSize: [36, 46], iconAnchor: [18, 46], tooltipAnchor: [0, -40],
      html: '<svg width="36" height="46" viewBox="0 0 36 46"><path d="M18 1C8.6 1 1 8.4 1 17.6 1 30 18 45 18 45s17-15 17-27.4C35 8.4 27.4 1 18 1z" fill="' + (color || '#d1242f') + '" stroke="#fff" stroke-width="2"/><circle cx="18" cy="17.5" r="6.5" fill="#fff"/></svg>'
    });
  }

  function dibujar() {
    capa.clearLayers();
    clientesVisibles().forEach(function (c) {
      if (ruta && ruta.ids.indexOf(c.id) !== -1) return;   // ese pin se dibuja numerado
      var m = L.marker([c.lat, c.lng], { icon: iconoPin(estadoC(c).color) })
        .bindTooltip(c.nombre, { permanent: true, direction: 'bottom', offset: [0, 0], className: 'etiqueta' });
      m.on('click', function () { mostrarFicha(c.id); });
      m.addTo(capa);
    });
    if (ruta) dibujarRuta();
  }
  function ajustarEtiquetas() {
    $('map').classList.toggle('lejos', map.getZoom() < 15);
    var pocos = (filtroDia !== null && filtroDia !== undefined) || !!seleccion;   // con pocos barrios a la vista, los nombres entran
    $('map').classList.toggle('muylejos', map.getZoom() < 14 && !pocos);
    $('map').classList.toggle('muycerca', map.getZoom() >= 17);
  }
  map.on('zoomend', ajustarEtiquetas);
  ajustarEtiquetas();

  /* ---------- Zonas (contornos de barrios de OpenStreetMap) ---------- */
  var ZONAS = [];            // { n: nombre, p: [[lng, lat], ...] }
  var seleccion = null;      // nombre de la zona elegida, o null = todas
  var capaZonas = L.layerGroup().addTo(map);

  function dentro(lat, lng, p) {
    var d = false;
    for (var i = 0, j = p.length - 1; i < p.length; j = i++) {
      var xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
      if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) d = !d;
    }
    return d;
  }
  function normal(t) {
    return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/^barrio\s+/, '').trim();
  }
  function zonaPorNombre(nombre) {
    var n = normal(nombre);
    return ZONAS.filter(function (z) { return normal(z.n) === n; })[0];
  }
  function zonaElegida() { return ZONAS.filter(function (z) { return z.n === seleccion; })[0]; }

  /* Día de visita y estado de cada barrio */
  var DIAS = [
    { n: 1, c: 'Lun', color: '#1f6feb' }, { n: 2, c: 'Mar', color: '#2da44e' },
    { n: 3, c: 'Mié', color: '#bf8700' }, { n: 4, c: 'Jue', color: '#8250df' },
    { n: 5, c: 'Vie', color: '#d1242f' }, { n: 6, c: 'Sáb', color: '#fb8500' },
    { n: 0, c: 'Dom', color: '#0a7e8c' }
  ];
  var ESTADOS = [
    { k: 'pendiente', t: 'Sin recorrer' }, { k: 'curso', t: 'En curso' }, { k: 'hecho', t: 'Recorrido ✓' }
  ];
  var filtroDia = null;      // null = todos, 'sin' = sin día, 0..6 = ese día
  function infoDe(nombre) {
    var i = zonasInfo[nombre] || {};
    return { dia: typeof i.dia === 'number' ? i.dia : null, estado: i.estado || 'pendiente', fecha: i.fecha || null };
  }
  function diaDe(nombre) {
    var d = infoDe(nombre).dia;
    return DIAS.filter(function (x) { return x.n === d; })[0] || null;
  }
  function cambiarInfo(nombre, cambios) {
    zonasInfo[nombre] = Object.assign(infoDe(nombre), cambios);
    guardar(LS_ZONAS, zonasInfo);
  }
  function pasaFiltro(z) {
    if (filtroDia === null) return true;
    var d = infoDe(z.n).dia;
    return filtroDia === 'sin' ? d === null : d === filtroDia;
  }
  function nombreFiltro() {
    if (filtroDia === 'sin') return 'Sin día';
    return DIAS.filter(function (x) { return x.n === filtroDia; })[0].c;
  }
  function fechaBonita(f) { var a = f.split('-'); return a[2] + '/' + a[1] + '/' + a[0]; }

  function clientesVisibles() {
    var z = zonaElegida();
    if (z) return clientes.filter(function (c) { return dentro(c.lat, c.lng, z.p); });
    if (filtroDia !== null) {
      var zs = ZONAS.filter(pasaFiltro);
      return clientes.filter(function (c) { return zs.some(function (q) { return dentro(c.lat, c.lng, q.p); }); });
    }
    return clientes;
  }

  function dibujarZonas() {
    capaZonas.clearLayers();
    ZONAS.forEach(function (z) {
      if (seleccion ? z.n !== seleccion : !pasaFiltro(z)) return;
      var inf = infoDe(z.n), dia = diaDe(z.n);
      var color = dia ? dia.color : '#8c959f';
      var hecho = inf.estado === 'hecho';
      var poly = L.polygon(z.p.map(function (q) { return [q[1], q[0]]; }), {
        color: color, weight: inf.estado === 'curso' ? 4 : 2, fillColor: color,
        fillOpacity: hecho ? 0.06 : (seleccion ? 0.12 : 0.25), dashArray: hecho ? '3 7' : null,
        interactive: !seleccion, bubblingMouseEvents: false
      });
      var et = document.createElement('span');
      et.textContent = (hecho ? '✓ ' : '') + z.n + (dia ? ' · ' + dia.c : '');
      poly.bindTooltip(et, { permanent: true, direction: 'center', className: 'etq-barrio', interactive: false });
      if (!seleccion) poly.on('click', function () { elegirZona(z.n); });
      poly.addTo(capaZonas);
      z.capa = poly;
    });
  }
  function encuadrar() {
    var g = L.featureGroup(capaZonas.getLayers());
    if (g.getLayers().length) map.fitBounds(g.getBounds(), { paddingTopLeft: [20, 20], paddingBottomRight: [20, 170] });
  }
  function elegirZona(nombre) {
    seleccion = nombre;
    dibujarZonas(); dibujar(); dibujarBarrios();
    ajustarEtiquetas();
    encuadrar();
  }
  function verTodas() {
    seleccion = null;
    dibujarZonas(); dibujar(); dibujarBarrios();
    ajustarEtiquetas();
    if (filtroDia !== null) encuadrar();
  }
  function ponerFiltro(v) {
    filtroDia = v;
    seleccion = null;
    dibujarZonas(); dibujar(); dibujarBarrios();
    ajustarEtiquetas();
    if (v !== null) {
      if (capaZonas.getLayers().length) encuadrar();
      else aviso('Todavía no hay barrios con ese día.');
    }
  }

  var btnLista = document.createElement('button');
  btnLista.className = 'primario';
  btnLista.textContent = 'Barrios ▾';
  var btnTodos = document.createElement('button');
  btnTodos.className = 'peligro';
  btnTodos.addEventListener('click', verTodas);
  var btnFiltro = document.createElement('button');

  /* ---------- Reparto automático de barrios en días ---------- */
  var repartoDias = [1, 2, 3, 4, 5, 6];
  var repartoMantener = true, repartoSaltar = true;
  var respaldoReparto = null;

  function plano(lat, lng) { return { x: (lng + 59.1) * Math.cos(-34.57 * Math.PI / 180) * 111.32, y: (lat + 34.57) * 110.57 }; }
  function medidas(z) {   // área en km² y centro del barrio
    var q = z.p.map(function (v) { return plano(v[1], v[0]); }), a = 0, cx = 0, cy = 0;
    for (var i = 0; i < q.length - 1; i++) {
      var f = q[i].x * q[i + 1].y - q[i + 1].x * q[i].y;
      a += f; cx += (q[i].x + q[i + 1].x) * f; cy += (q[i].y + q[i + 1].y) * f;
    }
    a /= 2;
    if (Math.abs(a) < 1e-9) return { area: 0, x: q[0].x, y: q[0].y };
    return { area: Math.abs(a), x: cx / (6 * a), y: cy / (6 * a) };
  }
  function repartir(dias, mantener, saltar) {
    var items = ZONAS.filter(function (z) { return !(saltar && infoDe(z.n).estado === 'hecho'); }).map(function (z) {
      var m = medidas(z);
      var nc = clientes.filter(function (c) { return dentro(c.lat, c.lng, z.p); }).length;
      return { z: z, x: m.x, y: m.y, area: m.area, w: Math.min(3, Math.max(0.15, m.area)) + 0.03 * nc, dia: null, fijo: false };
    });
    if (mantener) items.forEach(function (it) {
      var d = infoDe(it.z.n).dia;
      if (d !== null && dias.indexOf(d) !== -1) { it.dia = d; it.fijo = true; }
    });
    var libres = items.filter(function (it) { return !it.fijo; });
    var total = items.reduce(function (a, it) { return a + it.w; }, 0);
    var cap = total / dias.length * 1.15;
    var grupos = dias.map(function (d) { return { dia: d, x: null, y: null, carga: 0 }; });
    function centros() {
      grupos.forEach(function (g) {
        var its = items.filter(function (it) { return it.dia === g.dia; }), sw = 0, sx = 0, sy = 0;
        its.forEach(function (it) { sw += it.w; sx += it.x * it.w; sy += it.y * it.w; });
        g.carga = sw;
        if (sw) { g.x = sx / sw; g.y = sy / sw; }   // si quedó vacío, conserva su semilla
      });
    }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    centros();
    // semillas para los días que no tienen ningún barrio: el barrio libre más lejos de los centros ya puestos
    grupos.forEach(function (g) {
      if (g.x !== null) return;
      var ref = grupos.filter(function (o) { return o.x !== null; });
      var mejor = null, md = -1;
      libres.forEach(function (it) {
        if (it.dia !== null) return;
        var d = ref.length ? Math.min.apply(null, ref.map(function (o) { return dist(it, o); })) : -it.x;   // el primero: el más al oeste
        if (d > md) { md = d; mejor = it; }
      });
      if (mejor) { mejor.dia = g.dia; g.x = mejor.x; g.y = mejor.y; g.carga = mejor.w; }
    });
    for (var vuelta = 0; vuelta < 12; vuelta++) {
      libres.forEach(function (it) { it.dia = null; });
      centros();
      grupos.forEach(function (g) { if (g.x === null) { var o = grupos.filter(function (q) { return q.x !== null; })[0]; if (o) { g.x = o.x; g.y = o.y; } } });
      libres.slice().sort(function (a, b) { return b.w - a.w; }).forEach(function (it) {
        var orden = grupos.slice().sort(function (a, b) { return dist(it, a) - dist(it, b); });
        var g = orden.filter(function (q) { return q.carga + it.w <= cap; })[0] ||
                grupos.slice().sort(function (a, b) { return a.carga - b.carga; })[0];
        it.dia = g.dia; g.carga += it.w;
        var its = items.filter(function (o) { return o.dia === g.dia; }), sw = 0, sx = 0, sy = 0;   // el centro se va moviendo
        its.forEach(function (o) { sw += o.w; sx += o.x * o.w; sy += o.y * o.w; });
        g.x = sx / sw; g.y = sy / sw;
      });
    }
    return items;
  }

  function renderReparto() {
    var dc = $('pDias'); dc.textContent = '';
    DIAS.forEach(function (d) {
      var b = document.createElement('button');
      b.textContent = d.c; b.className = repartoDias.indexOf(d.n) !== -1 ? 'sel' : '';
      b.addEventListener('click', function () {
        var i = repartoDias.indexOf(d.n);
        if (i === -1) repartoDias.push(d.n); else repartoDias.splice(i, 1);
        renderReparto();
      });
      dc.appendChild(b);
    });
    var oc = $('pOpc'); oc.textContent = '';
    [['Respetar los que ya tienen día', 'repartoMantener'], ['Saltear los ya recorridos', 'repartoSaltar']].forEach(function (o) {
      var b = document.createElement('button');
      b.textContent = o[0];
      var on = o[1] === 'repartoMantener' ? repartoMantener : repartoSaltar;
      b.className = on ? 'sel' : '';
      b.addEventListener('click', function () {
        if (o[1] === 'repartoMantener') repartoMantener = !repartoMantener; else repartoSaltar = !repartoSaltar;
        renderReparto();
      });
      oc.appendChild(b);
    });
    $('pHacer').disabled = !repartoDias.length;
  }
  $('lRepartir').addEventListener('click', function () {
    if (!ZONAS.length) { aviso('Todavía no cargaron los barrios.'); return; }
    cerrar('vLista'); $('pResultado').textContent = ''; $('pDeshacer').style.display = 'none';
    renderReparto(); abrir('vReparto');
  });
  $('pCerrar').addEventListener('click', function () { cerrar('vReparto'); });
  $('pHacer').addEventListener('click', function () {
    var dias = repartoDias.slice().sort(function (a, b) { return (a || 7) - (b || 7); });
    var items = repartir(dias, repartoMantener, repartoSaltar);
    respaldoReparto = JSON.stringify(zonasInfo);
    // los días se ordenan de oeste a este para que el lunes sea lo más al oeste, etc.
    var porDia = {};
    items.forEach(function (it) { (porDia[it.dia] = porDia[it.dia] || []).push(it); });
    var orden = dias.slice().sort(function (a, b) {
      function cx(d) { var l = porDia[d] || []; return l.length ? l.reduce(function (s, it) { return s + it.x; }, 0) / l.length : 0; }
      return cx(a) - cx(b);
    });
    var diasOrden = dias.slice();
    var nombres = {};
    var hayFijos = items.some(function (it) { return it.fijo; });
    orden.forEach(function (d, i) { nombres[d] = hayFijos ? d : diasOrden[i]; });
    items.forEach(function (it) {
      if (!it.fijo) { cambiarInfo(it.z.n, { dia: nombres[it.dia] }); }
    });
    var lineas = diasOrden.map(function (d) {
      var l = items.filter(function (it) { return (it.fijo ? it.dia : nombres[it.dia]) === d; });
      var km = l.reduce(function (s, it) { return s + it.area; }, 0);
      return DIAS.filter(function (x) { return x.n === d; })[0].c + ': ' + l.length + ' barrios · ' + km.toFixed(1) + ' km²';
    });
    $('pResultado').textContent = 'Listo. Quedó así:\n' + lineas.join('\n') + '\n\nMirá el mapa con el filtro de cada día y corregí lo que no te cierre.';
    $('pDeshacer').style.display = '';
    dibujarZonas(); dibujarBarrios();
  });
  $('pDeshacer').addEventListener('click', function () {
    if (respaldoReparto === null) return;
    zonasInfo = JSON.parse(respaldoReparto); guardar(LS_ZONAS, zonasInfo);
    respaldoReparto = null;
    $('pResultado').textContent = 'Deshecho: volvieron los días que tenías antes.';
    $('pDeshacer').style.display = 'none';
    dibujarZonas(); dibujarBarrios();
  });

  /* ---------- Ruta ---------- */
  function guardarRuta() {
    if (ruta) guardar(LS_RUTA, ruta);
    else { try { localStorage.removeItem(LS_RUTA); } catch (e) {} }
  }
  function distKm(a, b) {
    var t = Math.PI / 180, dLa = (b.lat - a.lat) * t, dLo = (b.lng - a.lng) * t;
    var h = Math.pow(Math.sin(dLa / 2), 2) + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.pow(Math.sin(dLo / 2), 2);
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  }
  // Vecino más cercano y después 2-opt (destraba cruces). Camino abierto: arranca en el origen y no vuelve.
  function ordenar(origen, pts) {
    var path = [origen], rest = pts.slice();
    while (rest.length) {
      var last = path[path.length - 1], bi = 0, bd = Infinity;
      for (var i = 0; i < rest.length; i++) { var d = distKm(last, rest[i]); if (d < bd) { bd = d; bi = i; } }
      path.push(rest.splice(bi, 1)[0]);
    }
    var n = path.length, mejora = true, pasadas = 0;
    while (mejora && pasadas++ < 60) {
      mejora = false;
      for (var a = 1; a < n - 1; a++) {
        for (var b = a + 1; b < n; b++) {
          var p0 = path[a - 1], p1 = path[a], p2 = path[b], p3 = b + 1 < n ? path[b + 1] : null;
          var antes = distKm(p0, p1) + (p3 ? distKm(p2, p3) : 0);
          var despues = distKm(p0, p2) + (p3 ? distKm(p1, p3) : 0);
          if (despues < antes - 1e-9) {
            var seg = path.slice(a, b + 1).reverse();
            for (var k = 0; k < seg.length; k++) path[a + k] = seg[k];
            mejora = true;
          }
        }
      }
    }
    return path.slice(1);
  }
  function paradas() {
    return ruta.ids.map(function (id) { return clientes.filter(function (c) { return c.id === id; })[0]; }).filter(Boolean);
  }
  function proxima() {
    return paradas().filter(function (c) { return !ruta.hechos[c.id]; })[0] || null;
  }
  function crearRuta() {
    var todos = clientesVisibles();
    var pts = todos.filter(function (c) { return estadoC(c).k !== 'no' && estadoC(c).k !== 'cliente'; });
    if (todos.length > pts.length) aviso('Dejé afuera ' + (todos.length - pts.length) + ' que no les interesa o ya son clientes.');
    if (!pts.length) { aviso('No hay clientes para armar la ruta. Elegí un barrio o un día que tenga clientes.'); return; }
    if (pts.length > 80 && !confirm('Son ' + pts.length + ' clientes, la ruta va a ser larguísima. Conviene elegir un barrio primero. ¿Seguimos igual?')) return;
    var armar = function (origen) {
      var orden = ordenar(origen, pts);
      ruta = { ids: orden.map(function (c) { return c.id; }), hechos: {}, modo: (ruta && ruta.modo) || 'walking', origen: origen, creada: fechaLocal() };
      guardarRuta(); dibujar(); dibujarBarrios();
      map.fitBounds(L.latLngBounds(orden.map(function (c) { return [c.lat, c.lng]; })),
        { paddingTopLeft: [20, 20], paddingBottomRight: [20, 170] });
      abrirRuta();
    };
    var desdeCentro = function () { var c = map.getCenter(); armar({ lat: c.lat, lng: c.lng }); };
    if (!navigator.geolocation) { desdeCentro(); return; }
    aviso('Buscando tu ubicación para empezar la ruta…');
    navigator.geolocation.getCurrentPosition(function (p) {
      armar({ lat: p.coords.latitude, lng: p.coords.longitude });
    }, function () {
      aviso('No pude ver tu ubicación: la ruta arranca desde el centro del mapa.');
      desdeCentro();
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  }
  function dibujarRuta() {
    var ps = paradas();
    if (!ps.length) { ruta = null; guardarRuta(); dibujarBarrios(); return; }
    var pr = proxima();
    var ll = [[ruta.origen.lat, ruta.origen.lng]].concat(ps.map(function (c) { return [c.lat, c.lng]; }));
    L.polyline(ll, { color: '#1f6feb', weight: 4, opacity: 0.7 }).addTo(capa);
    L.circleMarker(ll[0], { radius: 7, color: '#fff', weight: 3, fillColor: '#1b1f24', fillOpacity: 1, interactive: false }).addTo(capa);
    ps.forEach(function (c, i) {
      var cls = ruta.hechos[c.id] ? 'h' : (pr && pr.id === c.id ? 'p' : '');
      L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'num', html: '<div class="' + cls + '">' + (i + 1) + '</div>', iconSize: [28, 28], iconAnchor: [14, 14] }) })
        .on('click', function () { mostrarFicha(c.id); }).addTo(capa);
    });
  }
  function urlMaps(lista, desde) {
    var dest = lista[lista.length - 1];
    var u = 'https://www.google.com/maps/dir/?api=1&travelmode=' + ruta.modo + '&destination=' + dest.lat + ',' + dest.lng;
    var via = lista.slice(0, -1).map(function (c) { return c.lat + ',' + c.lng; }).join('|');
    if (via) u += '&waypoints=' + encodeURIComponent(via);
    if (desde) u += '&origin=' + desde.lat + ',' + desde.lng;
    return u;
  }
  function abrirRuta() { renderRuta(); abrir('vRuta'); }
  function renderRuta() {
    if (!ruta) return;
    var ps = paradas();
    var hechas = ps.filter(function (c) { return ruta.hechos[c.id]; }).length;
    var km = 0, prev = ruta.origen;
    ps.forEach(function (c) { km += distKm(prev, c); prev = c; });
    $('rResumen').textContent = ps.length + ' paradas · ' + hechas + ' visitadas · unos ' + km.toFixed(1) +
      ' km en línea recta (por calle es un poco más)';
    var modo = $('rModo'); modo.textContent = '';
    [['walking', 'A pie'], ['driving', 'En auto']].forEach(function (m) {
      var b = document.createElement('button');
      b.textContent = m[1]; b.className = ruta.modo === m[0] ? 'sel' : '';
      b.addEventListener('click', function () { ruta.modo = m[0]; guardarRuta(); renderRuta(); });
      modo.appendChild(b);
    });
    var falta = ps.filter(function (c) { return !ruta.hechos[c.id]; });
    $('rProxima').style.display = falta.length ? '' : 'none';
    var tr = $('rTramos'); tr.textContent = '';
    for (var k = 0; k * 10 < falta.length; k++) {
      (function (k) {
        var ch = falta.slice(k * 10, k * 10 + 10);
        var b = document.createElement('button');
        b.textContent = 'Tramo ' + (k + 1) + ' (paradas ' + (ps.indexOf(ch[0]) + 1) + ' a ' + (ps.indexOf(ch[ch.length - 1]) + 1) + ')';
        b.addEventListener('click', function () {
          window.open(urlMaps(ch, k > 0 ? falta[k * 10 - 1] : null), '_blank', 'noopener');
        });
        tr.appendChild(b);
      })(k);
    }
    if (!falta.length) tr.textContent = 'Ya visitaste todas las paradas.';
    var lista = $('rLista'); lista.textContent = '';
    ps.forEach(function (c, i) {
      var fila = document.createElement('div');
      fila.className = 'parada' + (ruta.hechos[c.id] ? ' hecha' : '');
      var ok = document.createElement('button');
      ok.className = 'ok'; ok.textContent = ruta.hechos[c.id] ? '↩' : '✓';
      ok.setAttribute('aria-label', 'Marcar visitado');
      ok.addEventListener('click', function () {
        if (ruta.hechos[c.id]) delete ruta.hechos[c.id]; else ruta.hechos[c.id] = true;
        guardarRuta(); dibujar(); dibujarBarrios(); renderRuta();
      });
      var ver = document.createElement('button');
      ver.className = 'ver';
      ver.appendChild(document.createTextNode((i + 1) + '. ' + c.nombre));
      if (c.direccion) { var sm = document.createElement('small'); sm.textContent = c.direccion; ver.appendChild(sm); }
      ver.addEventListener('click', function () { cerrar('vRuta'); map.flyTo([c.lat, c.lng], 18); mostrarFicha(c.id); });
      fila.appendChild(ok); fila.appendChild(ver);
      lista.appendChild(fila);
    });
  }
  $('rCerrar').addEventListener('click', function () { cerrar('vRuta'); });
  $('rProxima').addEventListener('click', function () {
    var pr = proxima(); if (!pr) return;
    window.open('https://www.google.com/maps/dir/?api=1&travelmode=' + ruta.modo + '&destination=' + pr.lat + ',' + pr.lng, '_blank', 'noopener');
  });
  $('rRehacer').addEventListener('click', function () {
    if (confirm('Se arma de nuevo con los clientes que ves ahora y se pierden las marcas de visitado. ¿Seguimos?')) { cerrar('vRuta'); crearRuta(); }
  });
  $('rBorrar').addEventListener('click', function () {
    if (!confirm('¿Borrar la ruta? Los clientes no se tocan.')) return;
    ruta = null; guardarRuta(); cerrar('vRuta'); dibujar(); dibujarBarrios();
  });

  /* ---------- Exportar / Importar ---------- */
  $('btnExp').addEventListener('click', function () {
    var data = { app: 'mapa-clientes-lujan', version: 1, exportado: fechaLocal(), clientes: clientes, barrios: barrios, zonas: zonasInfo };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'clientes-lujan-' + fechaLocal() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    marcarExportado();
    $('btnExp').classList.remove('primario');
    aviso('Listo: ' + clientes.length + ' clientes exportados. Fijate en Descargas.');
  });

  function marcarExportado() { try { localStorage.setItem('mcl_ultimo_export', String(Date.now())); } catch (e) {} }
  function recordarBackup() {
    if (!clientes.length && !Object.keys(zonasInfo).length) return;
    var t = 0;
    try { t = +localStorage.getItem('mcl_ultimo_export') || 0; } catch (e) {}
    var dias = t ? Math.floor((Date.now() - t) / 86400000) : null;
    if (dias === null || dias >= 7) {
      $('btnExp').classList.add('primario');
      aviso(dias === null ? 'Todavía no hiciste backup. Tocá Exportar.' : 'Hace ' + dias + ' días que no hacés backup. Tocá Exportar.');
    }
  }
  $('btnImp').addEventListener('click', function () { $('archivo').value = ''; $('archivo').click(); });
  $('archivo').addEventListener('change', function () {
    var f = this.files[0];
    if (!f) return;
    var lector = new FileReader();
    lector.onload = function () {
      try {
        var d = JSON.parse(lector.result);
        var lc = Array.isArray(d) ? d : d.clientes;
        var lb = Array.isArray(d) ? [] : (d.barrios || []);
        if (!Array.isArray(lc)) throw new Error('formato');
        var okC = lc.filter(function (c) {
          return c && typeof c.nombre === 'string' && isFinite(c.lat) && isFinite(c.lng);
        }).map(function (c) {
          return { id: String(c.id || nuevoId()), nombre: c.nombre, direccion: String(c.direccion || ''), telefono: String(c.telefono || ''), nota: String(c.nota || ''), lat: +c.lat, lng: +c.lng,
                   estado: ESTADOS_C.some(function (e) { return e.k === c.estado; }) ? c.estado : 'nuevo' };
        });
        var okB = (Array.isArray(lb) ? lb : []).filter(function (b) {
          return b && typeof b.nombre === 'string' && isFinite(b.lat) && isFinite(b.lng);
        }).map(function (b) {
          return { id: String(b.id || nuevoId()), nombre: b.nombre, lat: +b.lat, lng: +b.lng, zoom: +b.zoom || 15 };
        });
        var okZ = {};
        if (!Array.isArray(d) && d.zonas && typeof d.zonas === 'object') {
          Object.keys(d.zonas).forEach(function (k) {
            var i = d.zonas[k] || {};
            okZ[k] = {
              dia: typeof i.dia === 'number' && i.dia >= 0 && i.dia <= 6 ? i.dia : null,
              estado: ['pendiente', 'curso', 'hecho'].indexOf(i.estado) !== -1 ? i.estado : 'pendiente',
              fecha: typeof i.fecha === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(i.fecha) ? i.fecha : null
            };
          });
        }
        var nZ = Object.keys(okZ).length;
        if (!okC.length && !okB.length && !nZ) throw new Error('vacio');
        if (!confirm('El archivo trae ' + okC.length + ' clientes, ' + okB.length + ' barrios propios y datos de ' + nZ + ' zonas.\nSe suman a los que ya tenés (si uno ya existe, se actualiza). ¿Seguimos?')) return;
        mezclar(clientes, okC); mezclar(barrios, okB);
        Object.assign(zonasInfo, okZ);
        guardar(LS_CLIENTES, clientes); guardar(LS_BARRIOS, barrios); guardar(LS_ZONAS, zonasInfo);
        dibujarZonas(); dibujar(); dibujarBarrios();
        aviso('Importado: ' + okC.length + ' clientes y ' + okB.length + ' barrios.');
      } catch (err) {
        aviso('Ese archivo no sirve. Tiene que ser un .json exportado desde esta app.');
      }
    };
    lector.readAsText(f);
  });
  function mezclar(destino, nuevos) {
    nuevos.forEach(function (n) {
      var i = destino.findIndex(function (x) { return x.id === n.id; });
      if (i >= 0) destino[i] = n; else destino.push(n);
    });
  }

  /* ---------- Arranque ---------- */
  dibujar();
  dibujarBarrios();
  recordarBackup();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  // Que la barra no tape el mapa: avisar a Leaflet si cambia el tamaño
  window.addEventListener('resize', function () { map.invalidateSize(); });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
